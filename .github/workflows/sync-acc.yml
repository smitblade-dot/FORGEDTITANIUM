name: Sync the published ACC into /acc/
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-acc
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Find the commit the ACC repository last published
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=""
          for id in $(gh api "repos/smitblade-dot/forgedtitanium-acc/deployments?environment=github-pages&per_page=10" --jq '.[].id'); do
            state=$(gh api "repos/smitblade-dot/forgedtitanium-acc/deployments/$id/statuses" --jq '.[0].state')
            if [ "$state" = "success" ]; then sha=$(gh api "repos/smitblade-dot/forgedtitanium-acc/deployments/$id" --jq .sha); break; fi
          done
          [ -n "$sha" ] || { echo "No successful ACC publication found; nothing to do."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          current=$(jq -r .commit acc/release.json 2>/dev/null || echo none)
          echo "published=$sha current=$current"
          if [ "$sha" = "$current" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v6
        if: steps.rel.outputs.changed == 'true'
        with:
          repository: smitblade-dot/forgedtitanium-acc
          ref: ${{ steps.rel.outputs.sha }}
          path: acc-src
      - uses: actions/setup-node@v4
        if: steps.rel.outputs.changed == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: acc-src/package-lock.json
      - name: The ACC tests must pass on the published commit
        if: steps.rel.outputs.changed == 'true'
        working-directory: acc-src
        run: |
          npm ci
          npm test
      - name: Copy the published site into acc/ and commit
        if: steps.rel.outputs.changed == 'true'
        run: |
          rsync -a --delete --exclude release.json acc-src/site/ acc/
          printf '{ "source": "smitblade-dot/forgedtitanium-acc", "commit": "%s", "note": "Published copy of the Agent Command Centre. The ACC repository is the single source of truth; do not edit this folder by hand." }\n' "${{ steps.rel.outputs.sha }}" > acc/release.json
          rm -rf acc-src
          if git status --porcelain | grep -v ' acc/'; then echo "Refusing to commit: changes outside acc/"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add acc
          git commit -m "Sync the published ACC into /acc/ (${{ steps.rel.outputs.sha }})"
          git push
